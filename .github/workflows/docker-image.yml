name: Build Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Version label shown in the admin UI, e.g. 2.0.6'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # This fork publishes its runtime image to the owner's GHCR namespace.
  IMAGE_NAME: oneadms/codex2api

jobs:
  harvest-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codex2api_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: codex2api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex2api_test -d codex2api_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Validate Mihomo and harvest integration on Linux
        env:
          CODEX2API_TEST_POSTGRES_DSN: postgres://codex2api_test:test-only@localhost:5432/codex2api_test?sslmode=disable
        run: go test -count=1 -timeout 8m ./internal/mihomo ./internal/harvest ./internal/util/logredact ./auth ./database ./proxy ./proxy/wsrelay ./admin
      - name: Validate harvest concurrency
        run: go test -race -count=1 -timeout 5m ./internal/harvest ./internal/mihomo ./proxy ./admin ./database -run 'TestCodexHarvest|TestCodexTicketHTTPFeedback|TestCodexTicketFeedbackCompletion|TestHarvestNodeRanking|TestUseOnce|TestCountry'
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate frontend types
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run typecheck && npm test
  docker:
    needs: harvest-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.build_version || github.ref_name }},enable=${{ inputs.build_version != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.build_version || github.ref_name }},enable=${{ inputs.build_version != '' || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ inputs.build_version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
